global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - warfriends-alerts.yml

scrape_configs:
  - job_name: warfriends
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: C:/ProgramData/WarFriends/secrets/admin-token.txt
    static_configs:
      - targets:
          - backend-1.internal:8080
          - backend-2.internal:8080
        labels:
          environment: production
          redis_required: "true"
